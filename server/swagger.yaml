info:
  title: XAM-PROD BACKEND
  description: XAM-PROD Application Backend API
  version: 1.0.0
  contact:
    name: SUBHAM MAITY
    url: https://github.com/Subham-Maity
    email: maitysubham4041@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
tags:
  - name: subham-xam
    description: Developer of this app
servers:
  - url: http://localhost:3336
    description: Local server (development)
  - url: http://210.89.44.183:3336/xam
    description: Staging server (testing)
  - url: http://210.89.44.183:3336/xam
    description: Production server (live)
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SubtitleExportFormat:
      type: string
      enum:
        - srt
        - text
    BatchExtractDto:
      type: object
      properties:
        videoProjectIds:
          description: Array of video project IDs to extract subtitles for
          example:
            - vid_1
            - vid_2
          type: array
          items:
            type: string
        format:
          default: srt
          allOf:
            - $ref: '#/components/schemas/SubtitleExportFormat'
        language:
          type: string
          description: Declared speech language (e.g. hi, hi-roman, en, ur, auto)
          example: hi
      required:
        - videoProjectIds
    MergeSubtitlesDto:
      type: object
      properties:
        videoProjectIds:
          description: Array of video project IDs to merge subtitles from
          example:
            - vid_1
            - vid_2
          type: array
          items:
            type: string
        format:
          default: srt
          allOf:
            - $ref: '#/components/schemas/SubtitleExportFormat'
      required:
        - videoProjectIds
    CreateCueDto:
      type: object
      properties: {}
    UpdateCueDto:
      type: object
      properties: {}
    RegenerateCuesDto:
      type: object
      properties: {}
    UpdateStyleDto:
      type: object
      properties: {}
    CreateExportDto:
      type: object
      properties: {}
