services:
  postgres:
    image: postgres:15-alpine
    container_name: add-subtitles-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5444:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: add-subtitles-redis
    restart: always
    ports:
      - "6380:6379"

  transcription:
    build: ./transcription-service
    container_name: add-subtitles-transcription
    ports:
      - "8001:8001"
    volumes:
      - ./storage:/storage
      - whisper-models:/root/.cache/huggingface
    environment:
      - WHISPER_MODEL=base
      - COMPUTE_TYPE=int8
      - DEVICE=cpu

  server:
    build: ./server
    container_name: add-subtitles-server
    ports:
      - "3336:3336"
    volumes:
      - ./storage:/storage
    environment:
      - PORT=3336
      - TRANSCRIPTION_SERVICE_URL=http://transcription:8001
      - STORAGE_DIR=/storage
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
      - transcription

  client:
    build: ./client
    container_name: add-subtitles-client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3336
    depends_on:
      - server

volumes:
  whisper-models:
  postgres-data:
